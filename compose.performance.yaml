name: dorify-perf

x-api-env: &api-env
  NODE_ENV: production
  PORT: 3000
  JWT_SECRET: ${PERF_JWT_SECRET:?generated by the performance fixture}
  REDIS_ENABLED: 'true'
  DB_MAX_CONNECTIONS: 100
  DB_RESERVED_CONNECTIONS: 20
  DB_API_INSTANCES: 1
  DB_POOL_MAX: 10
  DB_AGENT_POOL_MAX: 3
  DB_CONNECTION_TIMEOUT_MS: 5000
  DB_STATEMENT_TIMEOUT_MS: 30000
  DB_LOCK_TIMEOUT_MS: 3000
  DB_IDLE_TRANSACTION_TIMEOUT_MS: 15000
  AUTO_RUN_MIGRATIONS: 'false'
  THROTTLE_DEFAULT_LIMIT: ${PERF_RATE_LIMIT:-2000}
  THROTTLE_STRICT_LIMIT: ${PERF_RATE_LIMIT:-2000}
  THROTTLE_AUTH_LIMIT: ${PERF_RATE_LIMIT:-100}

services:
  intra-db:
    image: postgres:16-alpine
    environment:
      {
        POSTGRES_USER: perf,
        POSTGRES_PASSWORD: perf_local_only,
        POSTGRES_DB: dorify_perf,
      }
    ports: ['127.0.0.1:25432:5432']
    volumes: ['intra-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perf -d dorify_perf']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [intra]
  cloud-db:
    image: postgres:16-alpine
    environment:
      {
        POSTGRES_USER: perf,
        POSTGRES_PASSWORD: perf_local_only,
        POSTGRES_DB: dorify_perf,
      }
    ports: ['127.0.0.1:65432:5432']
    tmpfs: ['/var/lib/postgresql/data:size=768m']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U perf -d dorify_perf']
      interval: 2s
      timeout: 2s
      retries: 30
    networks: [cloud]
  intra-redis:
    image: redis:7-alpine
    networks: [intra]
  cloud-redis:
    image: redis:7-alpine
    networks: [cloud]
  intra-api:
    image: dorify/engine:dev
    init: true
    mem_limit: 768m
    cpus: 2
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://perf:perf_local_only@intra-db:5432/dorify_perf
      REDIS_URL: redis://intra-redis:6379
      DB_AGENT_INSTANCES: 1
      DORIFY_DEPLOYMENT_MODE: intra
      AUTH_REFRESH_COOKIE_NAME: refreshToken_perf_intra
    ports: ['127.0.0.1:23000:3000']
    depends_on:
      intra-db: { condition: service_healthy }
      intra-redis: { condition: service_started }
    networks:
      intra: { aliases: [engine] }
  cloud-api:
    image: dorify/engine:dev
    init: true
    mem_limit: 768m
    cpus: 2
    environment:
      <<: *api-env
      DATABASE_URL: postgresql://perf:perf_local_only@cloud-db:5432/dorify_perf
      REDIS_URL: redis://cloud-redis:6379
      DB_AGENT_INSTANCES: 0
      DORIFY_DEPLOYMENT_MODE: cloud
      AUTH_REFRESH_COOKIE_NAME: refreshToken_perf_cloud
    ports: ['127.0.0.1:63000:3000']
    depends_on:
      cloud-db: { condition: service_healthy }
      cloud-redis: { condition: service_started }
    networks:
      cloud: { aliases: [engine] }
  intra-ui:
    image: dorify/app:dev
    ports: ['127.0.0.1:28080:8080']
    depends_on: [intra-api]
    networks: [intra]
  cloud-ui:
    image: dorify/app:dev
    ports: ['127.0.0.1:48080:8080']
    depends_on: [cloud-api]
    networks: [cloud]
  agent:
    image: dorify/agent:dev
    init: true
    mem_limit: 256m
    environment:
      NODE_ENV: production
      AGENT_ENABLED: 'true'
      DATABASE_URL: postgresql://perf:perf_local_only@intra-db:5432/dorify_perf
      DB_AGENT_INSTANCES: 1
      DB_AGENT_POOL_MAX: 3
      DORIFY_ENGINE_URL: http://intra-api:3000
      DORIFY_CLOUD_URL: http://cloud-api:3000
      DORIFY_INSTALLATION_ID: ${PERF_INSTALLATION_ID:?generated by fixture}
      DORIFY_CLOUD_TOKEN: ${PERF_CLOUD_TOKEN:?generated by fixture}
      AGENT_POLL_INTERVAL_MS: 30000
      AGENT_REQUEST_TIMEOUT_MS: 10000
    depends_on: [intra-api, cloud-api]
    networks: [intra, cloud]

  loadgen:
    image: dorify/engine:dev
    init: true
    entrypoint:
      [
        'node',
        '--max-old-space-size=160',
        '/bench/scripts/performance/isolated-load.cjs',
      ]
    working_dir: /bench
    volumes: ['.:/bench']
    mem_limit: 256m
    cpus: 1
    environment:
      PERF_RUNNER_NETWORK: docker
      NODE_PATH: /app/node_modules
    networks: [intra, cloud]
    profiles: [tools]

volumes:
  intra-data:
  cloud-data:
networks:
  intra:
  cloud:
