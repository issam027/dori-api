name: dori

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dori
      POSTGRES_USER: dori
      POSTGRES_PASSWORD: dori_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dori_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dori -d dori"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  dori_postgres_data:
