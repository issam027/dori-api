        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
      responses:
        '200':
          description: Connexion réussie avec token JWT et profil
          headers:
            Set-Cookie:
              description: Cookie refreshToken HttpOnly, SameSite=Strict
              schema:
                type: string
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/LoginResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400':
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Trop de requêtes — limite de débit atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Erreur interne sans exposition de détails techniques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags: &ref_10
        - Authentification
      security: []
  /api/v1/auth/refresh:
    post:
      operationId: AuthController_refresh
      summary: Renouveler les tokens
      description: Échange un refresh token contre une nouvelle paire access/refresh (rotation).
      security:
        - refresh-cookie: []
        - {}
      parameters: []
      requestBody:
        required: false
        description: Optionnel lorsque le cookie HttpOnly refreshToken est présent.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshDto'
      responses:
        '200':
          description: Nouveaux tokens émis avec succès
          headers:
            Set-Cookie:
              description: Rotation du cookie refreshToken HttpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/TokensResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400':
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429':
          description: Trop de requêtes — limite de débit atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500':
          description: Erreur interne sans exposition de détails techniques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags: *ref_10
  /api/v1/auth/logout:
    post:
      operationId: AuthController_logout
      summary: Déconnexion
      description: >-
        Invalide la session courante du caller (sans body).


        **global_logout** : poster `{"userId": <votre_id>}` pour révoquer toutes vos sessions.


        **Force-disconnect** (manager/admin/root) : poster `{"userId": <id_cible>}` pour déconnecter un utilisateur
        hiérarchiquement inférieur.
      parameters: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutDto'
      responses:
        '200':
          description: Session terminée avec succès
          headers:
            Set-Cookie:
              description: Suppression du cookie refreshToken
              schema:
                type: string
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/SimpleMessageResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': &ref_11
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401': &ref_12
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404': &ref_13
          description: Ressource introuvable
          content:
            application/json:
              schema:
