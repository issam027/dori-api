openapi: 3.0.0
paths:
  /api/v1/audit-events:
    get:
      operationId: AuditController_search
      x-required-permissions:
        mode: all
        permissions:
          - audit_view
      summary: Rechercher le journal d'audit
      description: >-
        Liste paginée réservée aux managers, administrateurs et root, filtrée selon leur périmètre. Les filtres sont
        combinables et la période est limitée à 366 jours.
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page, à partir de 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre d'éléments par page, entre 1 et 100
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: number
        - name: siteId
          required: false
          in: query
          description: Scope du site historisé
          schema:
            example: 3
            type: string
            format: uuid
        - name: actorUserId
          required: false
          in: query
          description: ID de l'acteur
          schema:
            example: 7
            type: string
            format: uuid
        - name: action
          required: false
          in: query
          schema:
            example: site.create
            type: string
          description: Valeur du paramètre « action ».
        - name: targetType
          required: false
          in: query
          schema:
            example: site
            type: string
          description: Valeur du paramètre « target type ».
        - name: targetId
          required: false
          in: query
          schema:
            example: '42'
            type: string
            format: uuid
          description: Valeur du paramètre « target id ».
        - name: outcome
          required: false
          in: query
          schema:
            enum:
              - success
              - failure
            type: string
          description: Valeur du paramètre « outcome ».
        - name: correlationId
          required: false
          in: query
          schema:
            example: corr-01JXYZ
            type: string
          description: Valeur du paramètre « correlation id ».
        - name: search
          required: false
          in: query
          description: Recherche dans les libellés humains, action, type/cibles, corrélation et chemin HTTP
          schema:
            minLength: 2
            maxLength: 100
            example: site
            type: string
        - name: dateFrom
          required: false
          in: query
          schema:
            format: date
            example: '2026-10-01'
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: Première date incluse au format YYYY-MM-DD.
        - name: dateTo
          required: false
          in: query
          schema:
            format: date
            example: '2026-10-31'
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: Dernière date incluse au format YYYY-MM-DD.
      responses:
        '200':
          description: Résultats de la recherche d'audit
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/PaginatedAuditEventResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': &ref_0
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401': &ref_1
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403': &ref_2
          description: Accès interdit — permission insuffisante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404': &ref_3
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409': &ref_4
          description: Conflit métier (doublon, slot plein, compte verrouillé…)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422': &ref_5
          description: Entité non traitable — règle métier enfreinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429': &ref_6
          description: Trop de requêtes — limite de débit atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500': &ref_7
          description: Erreur interne sans exposition de détails techniques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags: &ref_8
        - Audit
      security: &ref_9
        - bearer: []
  /api/v1/audit-events/{eventId}:
    get:
      operationId: AuditController_findById
      x-required-permissions:
        mode: all
        permissions:
          - audit_view
      summary: Consulter un événement d'audit
      parameters:
        - name: eventId
          required: true
          in: path
          schema:
            format: uuid
            type: string
          description: Valeur du paramètre « event id ».
      responses:
        '200':
          description: Détail enrichi de l'événement d'audit
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/AuditEventDetailResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_0
        '401': *ref_1
        '403': *ref_2
        '404': *ref_3
        '409': *ref_4
        '422': *ref_5
        '429': *ref_6
        '500': *ref_7
      tags: *ref_8
      security: *ref_9
  /api/v1/auth/login:
    post:
      operationId: AuthController_login
      summary: Connexion
      description: >-
        Authentifie un utilisateur et retourne un access token JWT + un refresh token (aussi positionné en cookie
        HttpOnly).
