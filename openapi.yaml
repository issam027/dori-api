          in: query
          schema:
            minimum: 1
            example: 1
            type: string
            format: uuid
          description: Identifiant du site.
      responses:
        '200':
          description: Supervision opérationnelle
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/MonitoringLiveResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
      tags: *ref_110
      security:
        - bearer: []
  /api/v1/monitoring/series:
    get:
      operationId: MonitoringController_series
      x-required-permissions:
        mode: all
        permissions:
          - report_view
      summary: Série d’activité sur une période
      description: >-
        Agrège en un appel les volumes, durées et ventilations par file, utilisateur, forfait, statut et type d’entrée.
        registered est attribué à createdAt ; served à servedAt ; noShow et cancelled à closedAt. Les durées incomplètes
        sont exclues des moyennes. Exactement un périmètre doit être fourni : queueIds ou siteId. La période est
        inclusive, ordonnée et limitée à 366 jours.
      parameters:
        - name: siteId
          required: false
          in: query
          description: Site à superviser
          schema:
            minimum: 1
            type: string
            format: uuid
        - name: queueIds
          required: false
          in: query
          schema:
            example: 11111111-1111-4111-8111-111111111111,22222222-2222-4222-8222-222222222222
            type: string
            pattern: ^[0-9a-fA-F-]{36}(?:\s*,\s*[0-9a-fA-F-]{36})*$
          description: Valeur du paramètre « queue ids ».
        - name: userIds
          required: false
          in: query
          schema:
            example: 4,7
            type: string
          description: Valeur du paramètre « user ids ».
        - name: tierIds
          required: false
          in: query
          schema:
            example: 1,3
            type: string
          description: Valeur du paramètre « tier ids ».
        - name: statuses
          required: false
          in: query
          description: 'Valeurs autorisées : booked, waiting, in_progress, served, no_show, expired, cancelled'
          schema:
            example: served,no_show
            type: string
        - name: entryTypes
          required: false
          in: query
          schema:
            example: walkin,appointment
            type: string
          description: Valeur du paramètre « entry types ».
        - name: from
          required: true
          in: query
          schema:
            format: date-time
            example: '2026-10-01T00:00:00+02:00'
            type: string
          description: Valeur du paramètre « from ».
        - name: to
          required: true
          in: query
          schema:
            format: date-time
            example: '2026-11-01T00:00:00+01:00'
            type: string
          description: Valeur du paramètre « to ».
        - name: bucket
          required: false
          in: query
          schema:
            default: day
            enum:
              - hour
              - day
              - week
              - month
            type: string
          description: Valeur du paramètre « bucket ».
        - name: timezone
          required: false
          in: query
          description: Fuseau IANA ; par défaut, celui du site
          schema:
            example: Europe/Berlin
            type: string
      responses:
        '200':
          description: Série et synthèse d’activité
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/ReportSeriesResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
      tags: *ref_110
      security:
        - bearer: []
  /api/edge/v1/heartbeat:
    post:
      operationId: EdgeAgentController_heartbeat
      summary: Accept an installation heartbeat
      parameters:
        - name: x-dorify-installation-id
          required: true
          in: header
          schema:
            type: string
          description: Valeur du paramètre « x-dorify-installation-id ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeHeartbeatDto'
      responses:
        '204':
          description: ''
      tags: &ref_111
        - Edge agent
      security: &ref_112
        - edge-installation-token: []
  /api/edge/v1/commands:
    get:
      operationId: EdgeAgentController_commands
      summary: Pull allow-listed operational commands
      parameters:
        - name: x-dorify-installation-id
          required: true
          in: header
          schema:
            type: string
          description: Valeur du paramètre « x-dorify-installation-id ».
        - name: after
          required: false
          in: query
          description: Opaque cursor returned previously
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_111
      security: *ref_112
  /api/edge/v1/commands/{commandId}/ack:
    post:
      operationId: EdgeAgentController_acknowledge
      summary: Acknowledge durable local command receipt
      parameters:
        - name: x-dorify-installation-id
          required: true
          in: header
          schema:
            type: string
          description: Valeur du paramètre « x-dorify-installation-id ».
        - name: commandId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Valeur du paramètre « command id ».
      responses:
        '204':
          description: ''
      tags: *ref_111
      security: *ref_112
  /api/edge/v1/commands/{commandId}/result:
    post:
      operationId: EdgeAgentController_complete
      summary: Accept an idempotent command result
      parameters:
        - name: x-dorify-installation-id
          required: true
          in: header
          schema:
            type: string
          description: Valeur du paramètre « x-dorify-installation-id ».
        - name: commandId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Valeur du paramètre « command id ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EdgeCommandResultDto'
      responses:
        '204':
          description: ''
      tags: *ref_111
      security: *ref_112
  /api/v1/edge/installations:
    get:
      operationId: EdgeAdminController_list
      summary: List registered intra installations
      parameters: []
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/EdgeInstallationResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': &ref_113
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401': &ref_114
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403': &ref_115
          description: Accès interdit — permission insuffisante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404': &ref_116
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409': &ref_117
          description: Conflit métier (doublon, slot plein, compte verrouillé…)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422': &ref_118
          description: Entité non traitable — règle métier enfreinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429': &ref_119
          description: Trop de requêtes — limite de débit atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500': &ref_120
          description: Erreur interne sans exposition de détails techniques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags: &ref_121
        - Edge administration
      security: &ref_122
        - bearer: []
    post:
      operationId: EdgeAdminController_create
      summary: Register an intra installation and issue its one-time token
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEdgeInstallationDto'
      responses:
        '201':
          description: Créé avec succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/EdgeInstallationCredentialResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_113
        '401': *ref_114
        '403': *ref_115
        '404': *ref_116
        '409': *ref_117
        '422': *ref_118
        '429': *ref_119
        '500': *ref_120
      tags: *ref_121
      security: *ref_122
  /api/v1/edge/installations/{installationId}:
    get:
      operationId: EdgeAdminController_detail
      summary: Get installation health and recent command history
      parameters:
        - name: installationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Valeur du paramètre « installation id ».
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/EdgeInstallationDetailResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_113
        '401': *ref_114
        '403': *ref_115
        '404': *ref_116
        '409': *ref_117
        '422': *ref_118
        '429': *ref_119
        '500': *ref_120
      tags: *ref_121
      security: *ref_122
  /api/v1/edge/installations/{installationId}/commands:
    post:
      operationId: EdgeAdminController_command
      summary: Queue an allow-listed operational command
      parameters:
        - name: installationId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Valeur du paramètre « installation id ».
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEdgeCommandDto'
      responses:
        '201':
          description: Créé avec succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/EdgeCommandResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_113
        '401': *ref_114
        '403': *ref_115
        '404': *ref_116
        '409': *ref_117
        '422': *ref_118
        '429': *ref_119
