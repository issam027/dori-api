  /api/v1/sites:
    get:
      operationId: SitesController_findSites
      x-required-permissions:
        mode: all
        permissions:
          - site_view
      summary: Lister les sites
      description: >-
        Retourne la liste paginée de tous les sites d'accueil accessibles. Sans isActive, seules les ressources actives
        sont retournées ; isActive=false permet aux administrateurs de retrouver les ressources désactivées.
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page, à partir de 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre d'éléments par page, entre 1 et 100
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: number
        - name: sort
          required: false
          in: query
          description: field:asc|desc — le champ peut être en camelCase ou snake_case
          schema:
            type: string
            enum:
              - siteId:asc
              - siteId:desc
              - siteName:asc
              - siteName:desc
              - siteType:asc
              - siteType:desc
              - createdAt:asc
              - createdAt:desc
              - updatedAt:asc
              - updatedAt:desc
        - name: isActive
          required: false
          in: query
          description: Filtrer les sites par statut. Sans ce paramètre, les sites actifs et inactifs sont retournés.
          schema:
            type: boolean
      responses:
        '200':
          description: Liste paginée des sites
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/PaginatedSiteResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': &ref_18
          description: Données invalides (validation échouée)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401': &ref_19
          description: Non authentifié — token manquant ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '403': &ref_20
          description: Accès interdit — permission insuffisante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '404': &ref_21
          description: Ressource introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '409': &ref_22
          description: Conflit métier (doublon, slot plein, compte verrouillé…)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '422': &ref_23
          description: Entité non traitable — règle métier enfreinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '429': &ref_24
          description: Trop de requêtes — limite de débit atteinte
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '500': &ref_25
          description: Erreur interne sans exposition de détails techniques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
      tags: &ref_26
        - Sites
      security: &ref_27
        - bearer: []
    post:
      operationId: SitesController_createSite
      x-required-permissions:
        mode: all
        permissions:
          - site_create
      summary: Créer un nouveau site
      description: Crée un nouveau site avec ses paramètres horaires, de fuseau horaire et de tolérance.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSiteDto'
      responses:
        '201':
          description: Site créé avec succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/SiteResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_18
        '401': *ref_19
        '403': *ref_20
        '404': *ref_21
        '409': *ref_22
        '422': *ref_23
        '429': *ref_24
        '500': *ref_25
      tags: *ref_26
      security: *ref_27
  /api/v1/sites/{siteId}:
    get:
      operationId: SitesController_findSite
      x-required-permissions:
        mode: all
        permissions:
          - site_view
      summary: Détails d'un site
      description: >-
        Retourne la configuration complète d'un site spécifique. L’accès direct par identifiant reste possible quel que
        soit l’état actif ou désactivé de la ressource ; un PATCH avec isActive=true permet sa réactivation.
      parameters:
        - name: siteId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Identifiant du site.
        - name: ''
          required: true
          in: path
          description: ID du site
          schema:
            format: uuid
            type: string
      responses:
        '200':
          description: Détails du site
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/SiteResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_18
        '401': *ref_19
        '403': *ref_20
        '404': *ref_21
        '409': *ref_22
        '422': *ref_23
        '429': *ref_24
        '500': *ref_25
      tags: *ref_26
      security: *ref_27
    patch:
      operationId: SitesController_updateSite
      x-required-permissions:
        mode: all
        permissions:
          - site_edit
      summary: Modifier un site
      description: >-
        Met à jour la configuration générale, les horaires ou les poids de priorité du site. isActive=false désactive
        aussi toutes ses files. isActive=true réactive uniquement le site ; chaque file doit être réactivée
        explicitement afin de ne pas remettre en service une file précédemment arrêtée. L’accès direct par identifiant
        reste possible quel que soit l’état actif ou désactivé de la ressource ; un PATCH avec isActive=true permet sa
        réactivation.
      parameters:
        - name: siteId
          required: true
          in: path
          schema:
            type: string
            format: uuid
          description: Identifiant du site.
        - name: ''
          required: true
          in: path
          description: ID du site
          schema:
            format: uuid
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSiteDto'
      responses:
        '200':
          description: Site mis à jour avec succès
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/SiteResponseDto'
                required:
                  - code
                  - translationKey
                  - translationParams
                  - data
        '400': *ref_18
        '401': *ref_19
        '403': *ref_20
        '404': *ref_21
        '409': *ref_22
        '422': *ref_23
        '429': *ref_24
        '500': *ref_25
      tags: *ref_26
      security: *ref_27
    delete:
      operationId: SitesController_deleteSite
      x-required-permissions:
        mode: all
        permissions:
          - site_delete
      summary: Désactiver (supprimer) un site
      description: >-
        Désactive logiquement le site et toutes ses files associées dans une transaction unique. Une réactivation
        ultérieure du site ne réactive pas automatiquement les files. L’accès direct par identifiant reste possible quel
        que soit l’état actif ou désactivé de la ressource ; un PATCH avec isActive=true permet sa réactivation.
      parameters:
        - name: siteId
          required: true
          in: path
          schema:
            type: string
            format: uuid
