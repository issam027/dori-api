  /api/v1/registrations:
    get:
      operationId: RegistrationsController_findRegistrations
      x-required-permissions:
        mode: all
        permissions:
          - registration_view
      summary: Lister les inscriptions
      description: >-
        Recherche paginée, avec dateFrom/dateTo appliqués à businessDate pour les walk-ins et à scheduledTime dans le
        fuseau du site ou de la file pour les rendez-vous. dateFrom et dateTo doivent être fournies ensemble. Une
        recherche par période exige queueId ou siteId et couvre au maximum 366 jours. Sans isActive, seules les
        ressources actives sont retournées ; isActive=false permet aux administrateurs de retrouver les ressources
        désactivées.
      parameters:
        - name: page
          required: false
          in: query
          description: Numéro de page, à partir de 1
          schema:
            minimum: 1
            default: 1
            type: number
        - name: pageSize
          required: false
          in: query
          description: Nombre d'éléments par page, entre 1 et 100
          schema:
            minimum: 1
            maximum: 100
            default: 25
            type: number
        - name: sort
          required: false
          in: query
          description: field:asc|desc — le champ peut être en camelCase ou snake_case
          schema:
            type: string
            enum:
              - registrationId:asc
              - registrationId:desc
              - ticketNumber:asc
              - ticketNumber:desc
              - businessDate:asc
              - businessDate:desc
              - status:asc
              - status:desc
              - scheduledTime:asc
              - scheduledTime:desc
              - createdAt:asc
              - createdAt:desc
              - priorityReferenceTime:asc
              - priorityReferenceTime:desc
        - name: isActive
          required: false
          in: query
          description: >-
            true retourne les inscriptions actives, false les désactivées. Sans paramètre, seules les actives sont
            retournées.
          schema:
            default: true
            type: boolean
        - name: queueId
          required: false
          in: query
          schema:
            example: 1
            type: string
            format: uuid
          description: Identifiant de la file.
        - name: siteId
          required: false
          in: query
          schema:
            example: 1
            type: string
            format: uuid
          description: Identifiant du site.
        - name: dateFrom
          required: false
          in: query
          description: >-
            Première date incluse : businessDate pour un walk-in, scheduledTime dans le fuseau du site pour un
            rendez-vous. Doit être fournie avec dateTo et avec queueId ou siteId.
          schema:
            format: date
            example: '2026-10-01'
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: dateTo
          required: false
          in: query
          description: >-
            Dernière date incluse : businessDate pour un walk-in, scheduledTime dans le fuseau du site pour un
            rendez-vous. La période complète est limitée à 366 jours.
          schema:
            format: date
            example: '2026-10-31'
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
        - name: status
          required: false
          in: query
          description: Filtrer par statut
          schema:
            example: waiting
            type: string
        - name: entryType
          required: false
          in: query
          schema:
            enum:
              - walkin
              - appointment
            type: string
          description: 'Type d''entrée : sans rendez-vous ou rendez-vous.'
        - name: appointmentStatus
          required: false
          in: query
          schema:
            example: booked
            enum:
              - n/a
              - booked
              - checked_in
              - rescheduled
              - cancelled
              - expired
            type: string
          description: Statut du rendez-vous.
        - name: personId
          required: false
          in: query
          schema:
            example: 5
            type: string
            format: uuid
          description: Identifiant de la personne.
        - name: servedByUserId
          required: false
          in: query
          description: Filtrer par l'identifiant de l'utilisateur ayant servi le client
          schema:
            example: 12
            type: string
            format: uuid
        - name: tierId
          required: false
          in: query
          schema:
            example: 1
            type: string
            format: uuid
          description: Identifiant du forfait de service.
        - name: search
          required: false
          in: query
          description: Recherche libre (nom, ticket)
          schema:
            type: string
      responses:
        '200':
          description: Liste paginée des inscriptions
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: string
                    example: OK
                    description: Code applicatif du résultat
                  translationKey:
                    type: string
                    nullable: true
                    example: null
                    description: Clé de traduction du message (null si aucun message)
                  translationParams:
                    type: object
                    additionalProperties: true
                    example: {}
                    description: Paramètres de traduction
                  data:
                    $ref: '#/components/schemas/PaginatedRegistrationResponseDto'
                required:
                  - code
