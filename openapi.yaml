info:
  title: Dori API
  description: Spécification de référence de la plateforme de gestion de files d'attente et de rendez-vous Dori
  version: 1.0.0
  contact:
    name: Dori Support
  license:
    name: Propriétaire
tags:
  - name: Authentification
    description: Authentification, sessions et mots de passe
  - name: Sites
    description: Gestion des sites et affectation des gestionnaires
  - name: Queues
    description: Gestion et configuration des files d'attente
  - name: QueueEngine
    description: Moteur d'ordonnancement et pilotage des appels
  - name: Registrations
    description: Inscriptions, prise de tickets et suivi
  - name: Persons
    description: Gestion des profils usagers et historiques
  - name: Users
    description: Gestion des comptes utilisateurs et permissions
  - name: Notifications
    description: Gestion et envoi des notifications
  - name: Tiers
    description: Gestion des forfaits et priorités de service
  - name: Translations
    description: Gestion des traductions et bundles
  - name: Monitoring
    description: Santé technique, métriques et indicateurs d’activité
  - name: ScheduledTasks
    description: Déclenchement interne des traitements automatisés par Vercel Cron
servers:
  - url: http://localhost:3000
  - url: https://dori-api.vercel.app
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Token JWT d'accès
    edge-installation-token:
      scheme: bearer
      bearerFormat: installation-token
      type: http
      description: Jeton propre à une installation Dorify intra
    refresh-cookie:
      type: apiKey
      in: cookie
      name: refreshToken
      description: Refresh token HttpOnly
    registration-token:
      type: apiKey
      in: header
      name: X-Registration-Token
      description: Jeton public de suivi de position
    cron-secret:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Secret partagé CRON_SECRET envoyé automatiquement par Vercel Cron
  schemas:
    ErrorResponseDto:
      type: object
      properties:
        code:
          type: string
          example: USER_NOT_FOUND
          description: Code applicatif de l'erreur (voir catalogue des erreurs)
        translationKey:
          type: object
          example: errors.user_not_found
          nullable: true
          description: Clé de traduction i18n du message
        translationParams:
          type: object
          additionalProperties: true
          example:
            userId: 42
          description: Paramètres de traduction injectés dans le message
        data:
          type: object
          nullable: true
          description: 'Données contextuelles de l''erreur (ex: liste de champs invalides)'
          example:
            errors:
              - username must not be empty
      required:
        - code
        - translationKey
        - translationParams
    AuditEventResponseDto:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: Valeur du champ « event id ».
        actorUserId:
          type: string
          nullable: true
          description: Valeur du champ « actor user id ».
          format: uuid
        actorDisplayName:
          type: object
          nullable: true
          example: Sophie Martin (smartin)
          description: Valeur du champ « actor display name ».
        action:
          type: string
          example: queue.reset
          description: Valeur du champ « action ».
        targetType:
          type: string
          example: queue
          description: Valeur du champ « target type ».
        targetId:
          type: string
          nullable: true
          example: '8'
          description: Valeur du champ « target id ».
          format: uuid
        targetDisplayName:
          type: object
          nullable: true
          example: Accueil principal
          description: Valeur du champ « target display name ».
        secondaryTargetId:
          type: string
          nullable: true
          example: '12'
          description: Valeur du champ « secondary target id ».
          format: uuid
        secondaryTargetDisplayName:
          type: object
          nullable: true
          example: Opérateur Jean (jdupont)
          description: Valeur du champ « secondary target display name ».
        siteScopeId:
          type: string
          nullable: true
          example: 3
          description: Valeur du champ « site scope id ».
          format: uuid
        siteScopeDisplayName:
          type: object
          nullable: true
          example: Agence Centre
          description: Valeur du champ « site scope display name ».
        outcome:
          type: string
          enum: &ref_123
            - success
            - failure
          description: Valeur du champ « outcome ».
        correlationId:
          type: string
          nullable: true
          description: Valeur du champ « correlation id ».
        requestMethod:
          type: string
          example: POST
          description: Valeur du champ « request method ».
        requestPath:
          type: string
          example: queues/:queueId/reset
          description: Valeur du champ « request path ».
        failureType:
          type: object
          nullable: true
          example: DoriException
          description: Valeur du champ « failure type ».
        occurredAt:
          type: string
          format: date-time
          description: Valeur du champ « occurred at ».
      required:
        - eventId
        - action
        - targetType
        - outcome
        - requestMethod
        - requestPath
        - occurredAt
    PaginatedAuditEventResponseDto:
      type: object
      properties:
        page:
          type: number
          example: 1
          description: Page actuelle
        pageSize:
          type: number
          example: 25
          description: Taille de page
        total:
          type: number
          example: 100
          description: Nombre total d'éléments
        totalPages:
          type: number
          example: 4
          description: Nombre total de pages
        items:
          type: array
          items:
            $ref: '#/components/schemas/AuditEventResponseDto'
          description: Valeur du champ « items ».
      required:
        - page
        - pageSize
        - total
        - totalPages
        - items
    AuditEventDetailResponseDto:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
          description: Valeur du champ « event id ».
        actorUserId:
          type: string
          nullable: true
          description: Valeur du champ « actor user id ».
          format: uuid
        actorDisplayName:
          type: object
          nullable: true
          example: Sophie Martin (smartin)
          description: Valeur du champ « actor display name ».
        action:
          type: string
          example: queue.reset
          description: Valeur du champ « action ».
        targetType:
          type: string
          example: queue
          description: Valeur du champ « target type ».
        targetId:
          type: string
          nullable: true
          example: '8'
          description: Valeur du champ « target id ».
          format: uuid
        targetDisplayName:
          type: object
          nullable: true
          example: Accueil principal
          description: Valeur du champ « target display name ».
        secondaryTargetId:
          type: string
          nullable: true
          example: '12'
          description: Valeur du champ « secondary target id ».
          format: uuid
        secondaryTargetDisplayName:
          type: object
          nullable: true
          example: Opérateur Jean (jdupont)
          description: Valeur du champ « secondary target display name ».
        siteScopeId:
          type: string
          nullable: true
          example: 3
          description: Valeur du champ « site scope id ».
          format: uuid
        siteScopeDisplayName:
          type: object
          nullable: true
          example: Agence Centre
          description: Valeur du champ « site scope display name ».
        outcome:
          type: string
          enum: *ref_123
          description: Valeur du champ « outcome ».
        correlationId:
          type: string
          nullable: true
          description: Valeur du champ « correlation id ».
        requestMethod:
          type: string
          example: POST
          description: Valeur du champ « request method ».
        requestPath:
          type: string
          example: queues/:queueId/reset
          description: Valeur du champ « request path ».
        failureType:
          type: object
          nullable: true
          example: DoriException
          description: Valeur du champ « failure type ».
        occurredAt:
          type: string
          format: date-time
          description: Valeur du champ « occurred at ».
        actorUsername:
          type: object
          nullable: true
          example: smartin
          description: Valeur du champ « actor username ».
        actorFullName:
          type: object
          nullable: true
          example: Sophie Martin
          description: Valeur du champ « actor full name ».
        actorUserType:
          type: string
          nullable: true
          enum:
            - human
            - kiosk
          description: Valeur du champ « actor user type ».
        actorIsActive:
          type: object
          nullable: true
          description: Valeur du champ « actor is active ».
        targetIsActive:
          type: object
          nullable: true
          description: Valeur du champ « target is active ».
        secondaryTargetIsActive:
          type: object
          nullable: true
          description: Valeur du champ « secondary target is active ».
        siteScopeLocation:
          type: object
          nullable: true
          example: 12 avenue Centrale
          description: Valeur du champ « site scope location ».
        siteScopeTimezone:
          type: object
          nullable: true
          example: Europe/Paris
          description: Valeur du champ « site scope timezone ».
        siteScopeIsActive:
          type: object
          nullable: true
          description: Valeur du champ « site scope is active ».
        actionDisplayName:
          type: string
          example: Création d’un site
          description: Valeur du champ « action display name ».
      required:
        - eventId
        - action
        - targetType
        - outcome
        - requestMethod
        - requestPath
        - occurredAt
        - actionDisplayName
    AuthUserDto:
      type: object
      properties:
        userId:
          type: string
          example: 1
          description: ID unique de l'utilisateur
          format: uuid
        username:
          type: string
          example: admin
          description: Nom d'utilisateur
        fullName:
          type: string
          example: Jean Dupont
          description: Valeur du champ « full name ».
        email:
          type: string
          example: admin@dori.local
          description: Adresse email
        userType:
          type: string
          example: human
          enum: &ref_124
            - human
            - kiosk
          description: Type de compte
        roles:
          example: &ref_125
            - admin
          description: Rôles attribués
          type: array
          items:
            type: string
        permissions:
          example: &ref_126
            - site_view
            - queue_view
            - session_operate
          description: Permissions effectives
          type: array
          items:
            type: string
        mustChangePassword:
          type: boolean
          example: false
          description: Changement de mot de passe obligatoire
      required:
        - userId
        - username
        - userType
        - roles
        - permissions
        - mustChangePassword
    LoginResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Jeton JWT d'accès Bearer
        refreshToken:
          type: string
          example: 49c36121-3645-47d0-915d-1070e842de0f-...
          description: Jeton de rafraîchissement (rotation)
        user:
          description: Profil de l'utilisateur connecté
          allOf:
            - $ref: '#/components/schemas/AuthUserDto'
      required:
        - accessToken
        - refreshToken
        - user
    LoginDto:
      type: object
      properties:
        username:
          type: string
          example: root@dori.local
          description: Nom d'utilisateur ou adresse email
        password:
          type: string
          example: Root@123456
          description: Mot de passe
      required:
        - username
        - password
    TokensResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
          description: Nouveau jeton JWT d'accès
        refreshToken:
          type: string
          example: f87a8b9e-64d5-412e-9d2a-89a01cfba982-...
          description: Nouveau jeton de rafraîchissement
        user:
