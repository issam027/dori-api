name: dorify-proxy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  caddy_data:
    external: true
    name: dorify-proxy_caddy_data
  caddy_config:
    external: true
    name: dorify-proxy_caddy_config
